# WirePlumber policy for the RME Fireface family (UC / UCX / Babyface-classic).
#
# Installed system-wide by the totalcontrol package:
#   /etc/wireplumber/wireplumber.conf.d/60-fireface.conf
# Restart WirePlumber (or log out and back in) after installing.

# Pro Audio node tuning: interrupt (IRQ) scheduling for deterministic
# low-latency operation. disable-tsched = true drives the graph from the
# device's period interrupts; the device period floor (one URB) is the
# minimum graph quantum. The driver's fill lock holds the playback ring at
# a small, deterministic level (~1.7 URBs) with no server delay-locked loop
# on the device stream, so reliability costs no extra latency margin.
#
# This configuration relies on the driver's startup prefill gate (the
# `prefill` module parameter, default on): the gate mutes the outputs from
# trigger until the ring delivery is stable, turning the startup transient
# into one clean ~50-100 ms muted window per start/rate switch instead of
# scattered crackle. With the gate, start-delay = 0 starts clean.
#
# Ring capacity and ring fill are separate quantities:
#   * Capacity (period-num * period) is the artifact-prevention headroom. The
#     ring sits mostly empty in steady state, so a large capacity costs no
#     steady latency. It absorbs host write stalls.
#   * Fill (the delay target, period + headroom) is the steady-state latency.
#     It stays small (~1.7 URBs in IRQ mode at headroom 0).
#
# Wake invariant: the SPA IRQ-mode wake thresholds are
#   playback avail_min = buffer - (period + headroom)
#   capture  avail_min = min(period + headroom, buffer)
# Both degenerate when headroom >= buffer - period: the capture driver node
# then wakes once per full buffer instead of once per period, and the graph
# XRUN-storms at low rates. period-num = 32 keeps buffer = 32 * period well
# above period + headroom down to the 32-frame floor.
#
# Timer scheduling (disable-tsched = false) is the desktop-convenience
# alternative: its node resampler absorbs mixed-rate graphs and its graph
# quantum is independent of the device period. It needs a rate-scaled
# start-delay of about three URBs to avoid late dropouts at 96/192 kHz,
# which adds steady latency. IRQ mode is preferred for low-latency work.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        # IRQ scheduling: the deterministic low-latency pro path.
        api.alsa.disable-tsched = true
        # Link the playback follower PCM to the capture driver PCM in IRQ
        # mode (the documented Pro Audio default). The driver's XRUN
        # recovery only re-prepares linked followers; with this false the
        # playback stream stays stuck in XRUN after every rate change.
        api.alsa.auto-link = true
        # Ring capacity: ~32 ms at the period floor, more at larger quanta.
        # Mostly empty in steady state; absorbs host stalls.
        api.alsa.period-num = 32
        # Scheduling cushion: the delay target above the quantum. 0 keeps the
        # IRQ fill lock at its lowest deterministic level; the startup gate
        # covers the startup transient and the fill lock holds steady state
        # clean under load. Raise it (or start-delay) only if a heavier load
        # profile demands more write-jitter margin.
        api.alsa.headroom = 0
        # Startup prefill: the driver gate mutes until delivery is stable, so
        # the ring can start at the smallest fill without startup crackle.
        api.alsa.start-delay = 0
        # Keep the node running so the device clock stays locked and rate
        # changes apply to the running stream without a cold reopen.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface. TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]