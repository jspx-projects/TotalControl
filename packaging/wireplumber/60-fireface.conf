# WirePlumber policy for the RME Fireface family (UC / UCX / Babyface-classic).
#
# Installed system-wide by the totalcontrol package:
#   /etc/wireplumber/wireplumber.conf.d/60-fireface.conf
# Restart WirePlumber (or log out and back in) after installing.

# Pro Audio node tuning. TotalControl has one playback policy: interrupt
# scheduling with a period-aligned headroom (the cushion). The application
# sets the headroom to 2*P and period-num 32 before each deliberate rate or
# quantum change. This file is the fallback used when TotalControl is not
# running: interrupt scheduling with no extra headroom.
#
# The driver's startup prefill gate (the `prefill` module parameter, default
# on) mutes the outputs from trigger until ring delivery is stable, turning
# the startup transient into one clean muted window per start or rate switch.
#
# Ring capacity and ring fill are separate quantities:
#   * Capacity (period-num * period) absorbs host write stalls and adds no
#     steady latency.
#   * Headroom is the steady-state fill target; TotalControl sets 2*P.
#
# Wake invariant: the SPA wake thresholds degenerate when
# headroom >= buffer - period. period-num = 32 keeps buffer = 32 * period
# above period + headroom at every supported quantum.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        # Interrupt scheduling, the one policy. The app sets the headroom to
        # 2*P at runtime; this fallback uses no extra headroom.
        api.alsa.disable-tsched = true
        # Link the playback follower PCM to the capture driver PCM so the
        # driver's XRUN recovery re-prepares linked followers.
        api.alsa.auto-link = true
        # Ring capacity: absorbs host stalls; mostly empty in steady state.
        api.alsa.period-num = 32
        api.alsa.headroom = 0
        api.alsa.start-delay = 0
        # Advertise the device rates to PipeWire clients.
        audio.allowed-rates = [ 32000 44100 48000 64000 88200 96000 128000 176400 192000 ]
        # The nodes suspend when idle (the WirePlumber default): a suspended
        # graph lets the next client conduct its own rate. TotalControl writes
        # the graph defaults, which apply at the next re-prepare.
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface. TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]