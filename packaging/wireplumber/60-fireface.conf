# WirePlumber policy for the RME Fireface family (UC / UCX / Babyface-classic).
#
# Installed system-wide by the totalcontrol package:
#   /etc/wireplumber/wireplumber.conf.d/60-fireface.conf
# Restart WirePlumber (or log out and back in) after installing.

# Pro Audio node tuning — the convenience default (C1 three-tier model).
#
# TotalControl offers three paths, selected by "Rate follows":
#   * Device (pro): IRQ scheduling + a period-aligned cushion (headroom = 2*P),
#     set before each deliberate rate/quantum change. Perfect, predictable
#     low-latency pro audio. TotalControl applies this at runtime.
#   * PipeWire (convenience, the default): timer scheduling + a fixed generous
#     margin the DLL servos. Safe at every rate (the IRQ wake-threshold
#     alignment law does not apply in timer mode); latency is irrelevant for
#     listening/video. This packaged default is that convenience path.
#   * JACK: opens the device directly, just-in-time fill, lowest latency;
#     none of this applies.
#
# This configuration relies on the driver's startup prefill gate (the
# `prefill` module parameter, default on): the gate mutes the outputs from
# trigger until the ring delivery is stable, turning the startup transient
# into one clean ~50-100 ms muted window per start/rate switch instead of
# scattered crackle.
#
# Ring capacity and ring fill are separate quantities:
#   * Capacity (period-num * period) absorbs host write stalls; mostly empty
#     in steady state, so a large capacity costs no steady latency.
#   * Fill (the delay target, period + headroom) is the steady-state latency.
#     In timer mode the DLL holds the fill at the target; the BATCH rule adds
#     one period of headroom.
#
# Wake invariant: the SPA wake thresholds degenerate when
# headroom >= buffer - period. period-num = 16 keeps buffer = 16 * period
# above period + headroom at every supported quantum with headroom 336.
#
# start-delay here is a safe fixed fallback for when TotalControl is not
# running. TotalControl refines it to ~3 URBs scaled with rate (the timer
# path's post-switch dropout margin at 2x/4x); the gate covers startup.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        # Timer scheduling: the convenience default. The DLL servos the fill,
        # so a fixed margin is safe at every rate. TotalControl switches the
        # nodes to IRQ (disable-tsched = true) on the Device pro path.
        api.alsa.disable-tsched = false
        # Link the playback follower PCM to the capture driver PCM so the
        # driver's XRUN recovery re-prepares linked followers.
        api.alsa.auto-link = true
        # Ring capacity: absorbs host stalls; mostly empty in steady state.
        api.alsa.period-num = 16
        # Fixed generous margin (the convenience cushion). The DLL holds the
        # fill here; safe at every rate in timer mode (DRIVER-DESIGN §4.1).
        api.alsa.headroom = 336
        # Safe fixed startup fallback; TotalControl refines per rate.
        api.alsa.start-delay = 192
        # Keep the node running so the device clock stays locked and rate
        # changes apply to the running stream without a cold reopen.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface. TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]