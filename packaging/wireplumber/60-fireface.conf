# WirePlumber policy for the RME Fireface family (UC / UCX / Babyface-classic).
#
# Installed system-wide by the totalcontrol package:
#   /etc/wireplumber/wireplumber.conf.d/60-fireface.conf
# Restart WirePlumber (or log out and back in) after installing.

# Pro Audio node tuning. Polled scheduling (disable-tsched) makes the graph
# quantum equal the ALSA period, so the device's period floor (one URB) is the
# minimum graph quantum. The driver raises the ring to cover the in-flight URBs
# plus the UCX output lead plus margin; period-num=2 is the minimum request.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.auto-link = false
        api.alsa.period-num = 2
        # Scheduling cushion. PipeWire wakes the refill thread when the
        # queued delay falls to quantum + headroom (avail_min = buffer -
        # quantum - headroom). With headroom 0 the wake leaves one period
        # and a single late write starves the next URB at the period
        # floor. Headroom 192 = the largest URB across the supported
        # rates (192 frames at 192 kHz) guarantees one missed-write
        # tolerance at every rate; the buffer clamp (buffer - quantum)
        # scales the effective cushion down at lower rates. Cost: up to
        # one URB of extra queued latency. Raise this with the largest
        # supported URB if higher rates are added.
        api.alsa.headroom = 192
        # Keep the node running so the device clock stays locked and rate
        # changes apply to the running stream without a cold reopen.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface. TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]