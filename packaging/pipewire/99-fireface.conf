# PipeWire clock policy for the RME Fireface family (UC / UCX / Babyface-classic).
#
# Installed system-wide by the totalcontrol package:
#   /etc/pipewire/pipewire.conf.d/99-fireface.conf
# Restart PipeWire (or log out and back in) after installing.
#
# This is the permissive host-policy envelope. The driver owns the achievable
# per-rate envelope (the period floor is one URB); TotalControl's quantum picker
# offers only quanta at or above the current rate's floor. PipeWire's policy
# here must be wide enough to permit every quantum the driver accepts, so it
# never clamps a requested rate or quantum the device can run.
context.properties = {
    # The rates the Fireface transport core understands. Each device descriptor
    # limits its own card (UC/UCX/Babyface-classic are 32-192 kHz); the wider
    # tail lets the same module describe future RME units up to 768 kHz without
    # changing the host graph config.
    default.clock.allowed-rates = [
        32000 44100 48000 64000 88200 96000 128000 176400 192000
        352800 384000 705600 768000
    ]
    # 256 frames is the documented stable low-latency default for the UCX
    # transport. The device rate is the hub; the graph follows it.
    default.clock.quantum = 256
    # Permit the driver's lowest period floor (one URB = 32 frames at 32 kHz
    # with the default urb_frames=48). A higher min-quantum would clamp the
    # aggressive low-rate quanta the picker offers. The per-rate floor is
    # enforced by the driver and the picker, not here.
    default.clock.min-quantum = 32
    default.clock.max-quantum = 2048
}