# snd-fireface-uc module parameters.
#
# Installed system-wide by the totalcontrol-kmod package:
#   /etc/modprobe.d/fireface-uc.conf
# Takes effect on the next module load (reload or reboot).
#
# urb_frames sets the URB size at 1x rates and thus the period floor (one URB):
# the minimum graph quantum at each rate. nurbs sets the URBs in flight and thus
# the ring margin. These are the current defaults; the stable low-latency point
# is under investigation (the underrun predictive model) and will be tuned here
# once measured. Do not raise nurbs blindly.
options snd-fireface-uc urb_frames=48 nurbs=2