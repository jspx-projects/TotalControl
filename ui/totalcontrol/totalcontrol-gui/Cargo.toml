[package]
name = "totalcontrol-gui"
version = "0.3.1"
edition = "2021"
description = "GUI for TotalControl — direct control of RME hardware DSP mixers on Linux"
license = "GPL-3.0-only"

[features]
default = ["alsa"]
# ALSA class-compliant backend (Linux only) — pass-through to totalcontrol-core.
alsa = ["totalcontrol-core/alsa"]

[dependencies]
totalcontrol-core = { path = "../totalcontrol-core", default-features = false, features = ["usb"] }
totalcontrol-layout = { path = "../totalcontrol-layout" }
iced = { version = "0.14", features = ["canvas", "tokio", "advanced", "image-without-codecs"] }
log = "0.4"
env_logger = "0.11"
rosc = "0.11"
tokio = { version = "1", features = ["net", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
ksni = { version = "0.3.7", features = ["blocking"] }
rfd = "0.18"
