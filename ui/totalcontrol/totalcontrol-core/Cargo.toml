[package]
name = "totalcontrol-core"
version = "0.1.0"
edition = "2021"
description = "Core library for controlling RME audio interfaces"
license = "MIT"

[dependencies]
log = "0.4"
rand = "0.8"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
libc = "0.2"
alsa = { version = "0.9", optional = true }

[features]
default = ["alsa"]
# ALSA backend (Linux only).
alsa = ["dep:alsa"]

[[example]]
name = "alsa-scan"
required-features = ["alsa"]

[[example]]
name = "fireface-scan"
required-features = ["alsa"]

[[example]]
name = "fireface-events"
required-features = ["alsa"]

[[example]]
name = "fireface-ctl"
required-features = ["alsa"]

[[example]]
name = "fireface-levels"
required-features = ["alsa"]
