# TotalControl — expose the RME Babyface Pro FS (proprietary mode) to PipeWire
# as a stereo sink + stereo source, backed by the ALSA plugin
# (libasound_module_pcm_totalcontrol). Install to
# ~/.config/pipewire/pipewire.conf.d/50-totalcontrol.conf (or
# /etc/pipewire/pipewire.conf.d/) and restart PipeWire:
#   systemctl --user restart pipewire pipewire-pulse
#
# context.objects APPENDS to the default list (PipeWire merges arrays),
# so the stock Dummy-Driver etc. stay. Factory names are the PipeWire
# 1.6 spa-alsa ones (api.alsa.pcm.sink/source — the old
# playback/capture names no longer exist).
#
# The sink routes PB1 (the plugin's ch0/1) into the TotalMix mixer —
# route it to your output with the TotalControl GUI/TUI first (the mixer
# state persists on the device). Close the GUI while streaming: the
# device has ONE streaming session.

context.objects = [
    {   factory = adapter
        args = {
            factory.name = api.alsa.pcm.sink
            node.name = "totalcontrol"
            node.description = "RME Babyface Pro FS (TotalControl)"
            media.class = "Audio/Sink"
            api.alsa.path = "totalcontrol"
            api.alsa.period-size = 1024
            api.alsa.headroom = 0
            audio.position = [ FL FR ]
        }
    }
    {   factory = adapter
        args = {
            factory.name = api.alsa.pcm.source
            node.name = "totalcontrol-source"
            node.description = "RME Babyface Pro FS Input (TotalControl)"
            media.class = "Audio/Source"
            api.alsa.path = "totalcontrol"
            api.alsa.period-size = 1024
            audio.position = [ FL FR ]
        }
    }
]
