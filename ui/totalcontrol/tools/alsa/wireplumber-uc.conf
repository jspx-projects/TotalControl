# RME Fireface UC/UCX: Pro Audio node tuning.
# Install as ~/.config/wireplumber/wireplumber.conf.d/60-fireface-uc.conf.
#
# Reference copy of the packaged policy (packaging/wireplumber/60-fireface.conf).
# Timer-based scheduling is the shipped mode: the graph wakes on the host timer
# and the server's DLL holds the queued playback delay at its target, which
# keeps the ALSA ring level constant against the device clock.  In IRQ mode
# there is no such loop and the level decays until a late write starves.
#
# The card is a BATCH device: its pointer advances once per period (one URB).
# In timer mode PipeWire halves the requested period and adds one period of
# headroom above api.alsa.headroom, keeping the delay target above the
# quantum.
#
# period-num keeps buffer > period + headroom at every quantum, so the capture
# driver node keeps waking once per period.  The buffer size is
# latency-neutral: the delay target is period + headroom (+ one period for
# BATCH) and the start prefill is start-delay + period + headroom.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = false
        # Link the playback follower PCM to the capture driver PCM so the
        # driver's recovery re-prepares both directions.
        api.alsa.auto-link = true
        api.alsa.period-num = 16
        # Scheduling cushion: the delay target above the quantum.  336 frames
        # covers the largest URB across the supported rates; the BATCH rule
        # adds one more period in timer mode.
        api.alsa.headroom = 336
        # Keep the node running so the device clock stays locked and rate
        # changes apply to the running stream without a cold reopen.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface.  TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]
