# RME Fireface UC/UCX: Pro Audio node tuning.
# Install as ~/.config/wireplumber/wireplumber.conf.d/60-fireface-uc.conf.
#
# Reference copy of the packaged policy (packaging/wireplumber/60-fireface.conf).
# IRQ scheduling is the shipped mode: the graph wakes on the device's period
# interrupts and the driver's fill lock holds the playback ring at a small,
# deterministic level (~1.7 URBs) with no server level loop.  The driver's
# startup prefill gate (prefill module parameter, default on) mutes the
# outputs from trigger until delivery is stable, so start-delay = 0 starts
# clean.  Timer scheduling is the desktop-convenience alternative; it needs
# a rate-scaled start-delay of about three URBs to avoid late dropouts at
# 96/192 kHz.
#
# period-num keeps buffer > period + headroom at every quantum, so the capture
# driver node keeps waking once per period.  The buffer size is
# latency-neutral: the delay target is period + headroom and the start
# prefill is start-delay + period + headroom.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_(output|input).*Fireface.*pro-.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        # Link the playback follower PCM to the capture driver PCM so the
        # driver's recovery re-prepares both directions.
        api.alsa.auto-link = true
        api.alsa.period-num = 32
        # Scheduling cushion: 0 keeps the IRQ fill lock at its lowest
        # deterministic level; the startup gate covers the transient.
        api.alsa.headroom = 0
        # Startup prefill: the driver gate mutes until delivery is stable.
        api.alsa.start-delay = 0
        # Keep the node running so the device clock stays locked and rate
        # changes apply to the running stream without a cold reopen.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]

# Prefer the 18-channel Pro Audio profile for every Fireface.  TotalControl is a
# control-only mixer; the 18-channel Pro Audio nodes are its audio path.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*Fireface.*" }
    ]
    actions = {
      update-props = {
        priorities = [
          "pro-audio",
          "output:stereo-fallback+input:stereo-fallback",
          "output:stereo-fallback",
          "input:stereo-fallback"
        ]
      }
    }
  }
]
