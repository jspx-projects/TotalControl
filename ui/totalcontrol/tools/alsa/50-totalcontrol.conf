# TotalControl — the RME Babyface Pro FS in proprietary mode (TotalMix
# protocol). The mixer is driven by the TotalControl GUI/TUI; this PCM
# definition only carries audio to/from the device:
#
#   aplay  -D totalcontrol <file.wav>
#   arecord -D totalcontrol -f S24_LE -r 48000 -c 4 <file.wav>
#
# To make it the system default (after installing the plugin):
#   pcm.!default totalcontrol   (or use PipeWire with a totalcontrol virtual device)

pcm.totalcontrol {
    type totalcontrol
}
