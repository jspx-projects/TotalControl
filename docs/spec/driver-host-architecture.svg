     y="345"
     width="218.12448"
     height="215"
     rx="2.9083264"
     id="rect17" />
  <text
     class="label"
     x="275"
     y="370"
     font-weight="bold"
     id="text18">Device service thread</text>
  <text
     class="small"
     x="275"
     y="395"
     id="text19">owns the Fireface handle</text>
  <text
     class="small"
     x="275"
     y="415"
     id="text20">drains Command queue</text>
  <text
     class="small"
     x="275"
     y="435"
     id="text21">poll_events() / meters</text>
  <text
     class="small"
     x="275"
     y="455"
     id="text22">publishes Snapshot on change</text>
  <text
     class="small"
     x="275"
     y="475"
     id="text23">publishes MeterSnapshot</text>
  <text
     class="small"
     x="275"
     y="500"
     id="text24">single owner of hwdep I/O</text>
  <!-- UI thread -->
  <rect
     class="sub"
     x="580"
     y="345"
     width="224.99515"
     height="215"
     rx="2.9999354"
     id="rect24" />
  <text
     class="label"
     x="595"
     y="370"
     font-weight="bold"
     id="text25">UI thread</text>
  <text
     class="small"
     x="595"
     y="395"
     id="text26">holds a Mirror, not the handle</text>
  <text
     class="small"
     x="595"
     y="415"
     id="text27">setters queue a Command</text>
  <text
     class="small"
     x="595"
     y="435"
     id="text28">model updates on Snapshot</text>
  <text
     class="small"
     x="595"
     y="455"
     id="text29">view reads Mirror getters</text>
  <text
     class="small"
     x="595"
     y="475"
     id="text30">canvases read MeterSnapshot</text>
  <text
     class="small"
     x="595"
     y="500"
     id="text31">never blocks on the device</text>
