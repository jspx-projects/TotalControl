<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f7f7f9; stroke:#555; stroke-width:1.5; }
    .sub { fill:#ffffff; stroke:#888; stroke-width:1; }
    .title { font-size:16px; font-weight:bold; fill:#222; }
    .label { font-size:13px; fill:#222; }
    .small { font-size:11px; fill:#555; }
    .edge { stroke:#444; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .loop { stroke:#2a6; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .warn { stroke:#c66; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
  </style>

  <text class="title" x="460" y="30" text-anchor="middle">AP mode: implicit feedback regulates playback against the device clock</text>

  <!-- Device -->
  <rect class="box" x="40" y="70" width="240" height="380" rx="6"/>
  <text class="title" x="160" y="100" text-anchor="middle">RME device (AP)</text>
  <rect class="sub" x="60" y="120" width="200" height="90" rx="4"/>
  <text class="label" x="160" y="145" text-anchor="middle">IN packets</text>
  <text class="small" x="160" y="168" text-anchor="middle">position (13 bit)</text>
  <text class="small" x="160" y="186" text-anchor="middle">phase (14 bit accumulator)</text>
  <text class="small" x="160" y="204" text-anchor="middle">frame count</text>
  <rect class="sub" x="60" y="300" width="200" height="90" rx="4"/>
  <text class="label" x="160" y="325" text-anchor="middle">OUT packets</text>
  <text class="small" x="160" y="348" text-anchor="middle">lead word = play position</text>
  <text class="small" x="160" y="366" text-anchor="middle">+ sample words</text>
  <text class="small" x="160" y="384" text-anchor="middle">output latch</text>

  <!-- Driver -->
  <rect class="box" x="380" y="70" width="500" height="380" rx="6"/>
  <text class="title" x="400" y="100">Kernel driver</text>

  <rect class="sub" x="400" y="120" width="220" height="90" rx="4"/>
  <text class="label" x="510" y="145" text-anchor="middle">feedback buffer fb[]</text>
  <text class="small" x="510" y="168" text-anchor="middle">record IN position/frames</text>
  <text class="small" x="510" y="186" text-anchor="middle">indexed by packet number</text>

  <rect class="sub" x="650" y="120" width="210" height="90" rx="4"/>
  <text class="label" x="755" y="145" text-anchor="middle">cadence guard</text>
  <text class="small" x="755" y="168" text-anchor="middle">mean frames/pkt × 8000</text>
  <text class="small" x="755" y="186" text-anchor="middle">detects rate mismatch</text>

  <rect class="sub" x="400" y="250" width="220" height="100" rx="4"/>
  <text class="label" x="510" y="275" text-anchor="middle">OUT fill</text>
  <text class="small" x="510" y="298" text-anchor="middle">read fb[k − fb_delay]</text>
  <text class="small" x="510" y="316" text-anchor="middle">lead = position + out_lead</text>
  <text class="small" x="510" y="334" text-anchor="middle">mirror frame count</text>

  <rect class="sub" x="650" y="250" width="210" height="100" rx="4"/>
  <text class="label" x="755" y="275" text-anchor="middle">latch watchdog</text>
  <text class="small" x="755" y="298" text-anchor="middle">status byte 3 bit 7</text>
  <text class="small" x="755" y="316" text-anchor="middle">output ran dry</text>
  <text class="small" x="755" y="334" text-anchor="middle">→ recover_work</text>

  <rect class="sub" x="400" y="380" width="460" height="50" rx="4"/>
  <text class="label" x="630" y="410" text-anchor="middle">engine restart on broken URB queue / latch / error burst</text>

  <!-- Loop edges -->
  <path class="loop" d="M260,165 L400,165"/>
  <text class="small" x="285" y="155">IN header</text>
  <path class="loop" d="M510,210 L510,250"/>
  <text class="small" x="515" y="235">fb_delay behind</text>
  <path class="loop" d="M400,300 L260,345"/>
  <text class="small" x="280" y="315">OUT lead + samples</text>

  <!-- cadence / watchdog -->
  <path class="edge" d="M620,165 L650,165"/>
  <path class="warn" d="M755,210 L755,250"/>
  <path class="warn" d="M755,350 L755,380"/>
  <path class="warn" d="M630,350 L630,380"/>

  <text class="small" x="460" y="490">The device clock is the reference. The driver schedules OUT packets fb_delay packets behind the</text>
  <text class="small" x="460" y="508">captured IN position, adds out_lead margin, and mirrors the IN frame count. The phase accumulator</text>
  <text class="small" x="460" y="526">predicts frame add/drop at the wrap. Cadence and latch are guards; recovery restarts the engine.</text>
</svg>
