# PipeWire clock rates for the RME Fireface family.
#
# Install as:
#   ~/.config/pipewire/pipewire.conf.d/99-fireface-rates.conf
# then restart PipeWire (or log out and back in).
#
# These are the rates every supported Fireface device runs. Each device
# descriptor caps its card at 192 kHz (UC/UCX and Babyface-classic are
# 32-192 kHz) and the driver rejects any rate above that, so the allowed
# list is the device envelope itself.
context.properties = {
    default.clock.allowed-rates = [
        32000 44100 48000 64000 88200 96000 128000 176400 192000
    ]
}
